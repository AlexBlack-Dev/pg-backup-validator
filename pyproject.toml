[project]
name = "pg-backup-validator"
version = "0.1.0"
description = "Nightly PostgreSQL backup validator: restores the latest dump into an ephemeral Docker container, runs consistency checks, reports to Telegram/Slack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alex Black", email = "alexblack.eng@gmail.com" }]
keywords = ["postgresql", "backup", "dba", "docker", "pitr", "validation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "docker>=7.0.0",
  "psycopg[binary]>=3.1.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
pg-backup-validator = "pg_backup_validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
